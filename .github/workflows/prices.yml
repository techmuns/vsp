name: Refresh market prices

# Fetches PUBLIC reference data (AMFI fund NAVs + NSE stock closes/names) and
# commits public/data/{market-prices,fund-directory,stock-directory}.json. No
# personal data is involved and no secrets are needed. Cloudflare Pages
# auto-deploys on push.

on:
  schedule:
    # Weekdays at 14:30 UTC (~20:00 IST), after market close + NAV publish.
    - cron: '30 14 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-prices
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch prices
        run: node scripts/fetch-prices.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          FILES="public/data/market-prices.json public/data/fund-directory.json public/data/stock-directory.json"
          if ! git diff --quiet -- $FILES; then
            git add $FILES
            git commit -m "chore: refresh market prices & instrument directory"
            git push
          else
            echo "No market-data changes."
          fi
